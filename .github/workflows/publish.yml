name: Publish and Release
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Existing version tag to publish (vX.Y.Z)
        required: true
        type: string

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - id: commit
        name: Resolve and validate release tag
        env:
          RELEASE_TAG: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expected a stable version tag such as v0.4.0" >&2
            exit 1
          }
          sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          git checkout --detach "$sha"
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          [[ "$RELEASE_TAG" == "v$version" ]] || {
            echo "Release tag does not match package.json version" >&2
            exit 1
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  verify-release:
    needs: resolve-release
    if: ${{ !cancelled() && needs.resolve-release.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve-release.outputs.sha }}

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [resolve-release, verify-release]
    if: ${{ !cancelled() && needs.verify-release.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npm publish
